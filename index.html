<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forever">
  <meta name="description" content="Neoficiální český deník World of Warcraft Forever. Všech devět class Hordy, kronika, talentové buildy, rotace a Legacy tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Forever Companion – Azeroth čeká</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">F</div>
      <div class="brand-name"><strong>FOREVER</strong><span>COMPANION · HORDA</span></div>
      <div class="top-actions"><span class="beta-pill">V2.1 · DENÍK POSTAV</span></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Hlavní navigace">
      <button type="button" data-tab="home"><span class="nav-ico">⌂</span><span>Přehled</span></button>
      <button type="button" data-tab="characters"><span class="nav-ico">♟</span><span>Postavy</span></button>
      <button type="button" data-tab="diary"><span class="nav-ico">▤</span><span>Deník</span></button>
      <button type="button" data-tab="legacy"><span class="nav-ico">✧</span><span>Legacy</span></button>
      <button type="button" data-tab="guide"><span class="nav-ico">◈</span><span>Průvodce</span></button>
      <button type="button" data-tab="settings"><span class="nav-ico">⚙</span><span>Data</span></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
